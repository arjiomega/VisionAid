services:
  tts-grpc:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  stt-grpc:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      tts-grpc:
        condition: service_healthy
      stt-grpc:
        condition: service_healthy
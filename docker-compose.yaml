services:

  db:
    image: postgres:16
    container_name: visualaid_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: visualaid_db
    volumes:
      - local_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  tts-grpc:
    build:
      context: ./services/tts
      dockerfile: Dockerfile

  stt-grpc:
    build:
      context: ./services/stt
      dockerfile: Dockerfile

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - tts-grpc
      - stt-grpc

volumes:
  local_pgdata: